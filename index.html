.pv-info{padding:14px 16px!important;border-radius:20px!important}
.pv-title{font-size:19px;font-weight:700;letter-spacing:-.02em;line-height:1.25}
.pv-meta{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;margin-top:8px;font-size:13px;color:var(--text2)}
.pv-acc{display:inline-flex;align-items:center;gap:6px;color:var(--text)}
.pv-st{height:22px;padding:0 9px;border-radius:999px;display:inline-flex;align-items:center;font-size:12px;font-weight:600;background:var(--mg-in)}
.pv-st.s-planned{color:var(--orange);background:rgba(255,159,10,.14)}.pv-st.s-live{color:var(--green);background:rgba(48,209,88,.14)}
.pv-d{display:inline-flex;align-items:center;gap:4px}.pv-d svg{width:13px;height:13px}
.pv-hook{margin-top:10px;font-size:14px;line-height:1.4;color:var(--text2)}
.pv-btns{display:flex;gap:10px}
.pv-btns .btn{flex:1;height:50px;border-radius:999px;font-size:16px;text-decoration:none}
.pv-btns .btn svg{width:18px;height:18px}
.pv-btns a.btn{flex:0 0 auto;padding:0 18px;color:var(--text)}
.kthumb .kwarn{position:absolute;right:4px;top:4px;width:16px;height:16px;border-radius:50%;background:var(--orange);color:#000;font:800 11px/16px -apple-system,system-ui,sans-serif;text-align:center;box-shadow:0 0 0 2px #000}

/* =========================================================
   Flotte – neu: weich, ruhig, pro Account eine Farbe
   ========================================================= */
.card.fx{position:relative;overflow:hidden;padding:20px 20px 16px;border-radius:30px;cursor:pointer;isolation:isolate;
  background:linear-gradient(160deg,color-mix(in srgb,var(--ac) 14%,transparent),transparent 55%),var(--mg);
  box-shadow:var(--mg-edge),0 30px 60px -36px color-mix(in srgb,var(--ac) 70%,transparent),0 20px 40px -26px rgba(0,0,0,.8);
  transition:transform .5s var(--spring),box-shadow .5s var(--ease)}
.card.fx:hover{transform:translateY(-3px)}
.card.fx:active{transform:scale(.985)}
.fx.paused{filter:saturate(.25);opacity:.7}
.fx-glow{position:absolute;z-index:-1;right:-30%;top:-45%;width:85%;aspect-ratio:1;border-radius:50%;pointer-events:none;
  background:radial-gradient(closest-side,color-mix(in srgb,var(--ac) 42%,transparent),transparent);filter:blur(14px);opacity:.75;
  animation:fxbreathe 7s ease-in-out infinite alternate}
@keyframes fxbreathe{to{transform:translate(-6%,8%) scale(1.08);opacity:.95}}
.fx-top{display:flex;align-items:center;gap:14px}
.fx-av{flex:none}
.fx-av .ring-bg{stroke:rgba(255,255,255,.1)}
.fx-av .ring-fg{filter:drop-shadow(0 0 6px color-mix(in srgb,var(--ac) 70%,transparent))}
.fx-id{flex:1;min-width:0;line-height:1.25}
.fx-id b{display:block;font-size:19px;font-weight:700;letter-spacing:-.03em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fx-id span{display:block;font-size:13.5px;color:var(--text2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fx-id em{display:inline-block;margin-top:6px;max-width:100%;font-style:normal;font-size:12px;font-weight:600;padding:3px 9px;border-radius:999px;
  color:color-mix(in srgb,var(--ac) 80%,#fff);background:color-mix(in srgb,var(--ac) 16%,transparent);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.icon-btn.fx-edit{width:36px;height:36px;align-self:flex-start;background:rgba(255,255,255,.07);box-shadow:none;opacity:.8}
.icon-btn.fx-edit svg{width:16px;height:16px}
.fx-today{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin-top:22px}
.fx-big{display:flex;align-items:baseline;gap:6px;line-height:.9}
.fx-big b{font-size:54px;font-weight:700;letter-spacing:-.06em;font-variant-numeric:tabular-nums}
.fx-big b em{font-style:normal}
.fx-big span{font-size:20px;font-weight:600;color:var(--text3);letter-spacing:-.02em}
.fx-tl{display:flex;flex-direction:column;align-items:flex-end;gap:8px;padding-bottom:4px;min-width:0}
.fx-msg{display:inline-flex;align-items:center;gap:5px;font-size:13px;font-weight:600;color:var(--text2);white-space:nowrap}
.fx-msg svg{width:14px;height:14px;color:var(--green)}
.fx.done .fx-msg{color:var(--green)}
.fx-pills{display:flex;gap:6px}
.fx-st{display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 10px;border-radius:999px;font-size:12px;font-weight:600;color:var(--text2);background:rgba(255,255,255,.07);box-shadow:inset 0 0 0 .5px rgba(255,255,255,.1)}
.fx-st i{width:6px;height:6px;border-radius:50%;background:#8e8e93}
.fx-st.active{color:var(--green)}.fx-st.active i{background:var(--green);animation:pulse 2.4s ease-out infinite}
.fx-st.warmup{color:var(--orange)}.fx-st.warmup i{background:var(--orange)}
.fx-st.fx-fl{color:#ff9f0a;gap:4px}.fx-st.fx-fl svg{width:13px;height:13px}
.fx-week{margin-top:20px;padding:14px 14px 12px;border-radius:22px;background:rgba(255,255,255,.045);box-shadow:inset 0 0 0 .5px rgba(255,255,255,.08)}
.fx-wh{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:12px}
.fx-wh span{font-size:12px;font-weight:600;color:var(--text2)}
.fx-wh b{font-size:14px;font-weight:700;font-variant-numeric:tabular-nums}
.fx-wh small{font-size:12px;font-weight:600;color:var(--text3)}
.fx-days{display:flex;justify-content:space-between;gap:4px}
.fx-d{display:flex;flex-direction:column;align-items:center;gap:7px;flex:1}
.fx-d i{position:relative;width:30px;height:30px;border-radius:50%;
  background:conic-gradient(var(--ac) calc(var(--r)*360deg),rgba(255,255,255,.1) 0);
  -webkit-mask:radial-gradient(farthest-side,transparent calc(100% - 4px),#000 calc(100% - 3.5px));mask:radial-gradient(farthest-side,transparent calc(100% - 4px),#000 calc(100% - 3.5px));
  animation:fxpop .7s var(--spring) both}
.fx-d.full i{-webkit-mask:none;mask:none;background:var(--ac);box-shadow:0 6px 16px -6px var(--ac)}
@keyframes fxpop{from{transform:scale(.4);opacity:0}}
.fx-d span{font-size:11px;font-weight:600;color:var(--text3)}
.fx-d.today span{color:var(--text);font-weight:700}
.fx-d.today span::after{content:"";display:block;width:4px;height:4px;margin:3px auto 0;border-radius:50%;background:var(--ac)}
.fx-foot{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:14px}
.fx-pipe{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--text2);min-width:0;white-space:nowrap}
.fx-pipe b{color:var(--text);font-weight:700;font-variant-numeric:tabular-nums}
.fx-pipe i{width:3px;height:3px;border-radius:50%;background:var(--text3);margin:0 3px}
.fx-go{flex:none;display:inline-flex;align-items:center;gap:6px;height:38px;padding:0 14px 0 16px;border:0;border-radius:999px;cursor:pointer;
  font:600 14px/1 inherit;font-family:inherit;color:#fff;background:var(--ac);box-shadow:0 10px 22px -10px var(--ac),inset 0 1px 0 rgba(255,255,255,.25);transition:transform .35s var(--spring)}
.fx-go svg{width:16px;height:16px;transition:transform .35s var(--spring)}
.fx-go:hover svg{transform:translateX(3px)}
.fx-go:active{transform:scale(.94)}
/* Hell */
html.light .card.fx{background:linear-gradient(160deg,color-mix(in srgb,var(--ac) 12%,#fff),rgba(255,255,255,.7) 55%);box-shadow:var(--mg-edge),0 26px 50px -34px color-mix(in srgb,var(--ac) 60%,transparent),0 2px 6px rgba(30,40,80,.06)}
html.light .fx-av .ring-bg{stroke:rgba(118,118,128,.16)}

html.light .icon-btn.fx-edit,html.light .fx-st{background:rgba(118,118,128,.1);box-shadow:none}
html.light .fx-week{background:rgba(255,255,255,.6);box-shadow:inset 0 0 0 .5px rgba(60,60,67,.1)}
html.light .fx-d i{background:conic-gradient(var(--ac) calc(var(--r)*360deg),rgba(118,118,128,.16) 0)}
html.light .fx-d.full i{background:var(--ac)}
html.light .fx-glow{opacity:.45}
@media(prefers-reduced-motion:reduce){.fx-glow,.fx-d i{animation:none}}

/* =========================================================
   Pipeline ohne Live · Flotte kompakt (Handy) · Kalender-Checkliste
   ========================================================= */
@media(min-width:760px){.board{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:600px){
  .card.fx{display:grid;grid-template-columns:1fr auto;grid-template-areas:"top today" "week week" "foot foot";align-items:center;column-gap:10px;padding:16px 16px 14px;border-radius:26px}
  .fx-top{grid-area:top;gap:12px;min-width:0}
  .fx-av .ring{width:50px!important;height:50px!important}
  .fx-av .ring svg{width:100%;height:100%}
  .fx-av .av{--s:40px!important}
  .fx-id b{font-size:17px}.fx-id span{font-size:13px}
  .fx-id em,.fx-edit,.fx-tl{display:none!important}
  .fx-today{grid-area:today;margin:0;align-self:center}
  .fx-big b{font-size:34px}.fx-big span{font-size:15px}
  .fx-week{grid-area:week;margin-top:14px;padding:10px 12px 9px;border-radius:18px}
  .fx-wh{margin-bottom:8px}
  .fx-d{gap:5px}.fx-d i{width:24px;height:24px}
  .fx-d span{font-size:10px}
  .fx-d.today span::after{margin-top:2px}
  .fx-foot{grid-area:foot;margin-top:12px}
  .fx-go{height:34px;font-size:13px;padding:0 12px 0 14px}
  .fx-glow{width:70%;top:-60%}
}
/* Kalender-Checkliste */
.acal{display:flex;flex-direction:column;gap:12px;padding-bottom:6px}
.ac-head{display:flex;align-items:center;gap:12px;padding:2px 4px 4px}
.ac-id{flex:1;min-width:0}
.ac-id b{display:block;font-size:20px;font-weight:700;letter-spacing:-.03em}
.ac-id span{display:block;font-size:13px;color:var(--text2)}
.ac-streak{display:inline-flex;align-items:center;gap:4px;height:28px;padding:0 11px;border-radius:999px;font-weight:700;font-size:14px;color:#ff9f0a;background:rgba(255,159,10,.14)}
.ac-streak svg{width:15px;height:15px}
.ac-cal,.ac-list{padding:14px!important;border-radius:24px!important;position:relative;overflow:hidden}
.ac-cal::before{content:"";position:absolute;inset:-40% -30% auto auto;width:70%;aspect-ratio:1;border-radius:50%;pointer-events:none;background:radial-gradient(closest-side,color-mix(in srgb,var(--ac) 30%,transparent),transparent);filter:blur(10px)}
.ac-mh{position:relative;display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.ac-mh>div{text-align:center}
.ac-mh b{display:block;font-size:17px;font-weight:700;letter-spacing:-.02em}
.ac-mh span{font-size:12px;color:var(--text2);font-variant-numeric:tabular-nums}
.ac-mh .icon-btn{width:36px;height:36px}.ac-mh .icon-btn svg{width:17px;height:17px}
.ac-wd,.ac-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;position:relative}
.ac-wd span{text-align:center;font-size:11px;font-weight:600;color:var(--text3);padding-bottom:6px}
.ac-d{position:relative;display:grid;place-items:center;aspect-ratio:1;border:0;background:none;padding:0;cursor:pointer;color:var(--text);font:600 14px/1 inherit;font-family:inherit;border-radius:14px;transition:background .2s}
.ac-d span{position:relative;display:grid;place-items:center;width:min(38px,88%);aspect-ratio:1;border-radius:50%;font-variant-numeric:tabular-nums}
.ac-d span::before{content:"";position:absolute;inset:0;border-radius:50%;background:conic-gradient(var(--ac) calc(var(--r)*360deg),rgba(255,255,255,.09) 0);
  -webkit-mask:radial-gradient(farthest-side,transparent calc(100% - 3px),#000 calc(100% - 2.5px));mask:radial-gradient(farthest-side,transparent calc(100% - 3px),#000 calc(100% - 2.5px))}
.ac-d.full span{background:var(--ac);color:#fff;box-shadow:0 6px 14px -6px var(--ac)}
.ac-d.full span::before{display:none}
.ac-d.fut{color:var(--text3)}.ac-d.fut span::before{opacity:.5}
.ac-d.today span{font-weight:800;color:var(--ac)}
.ac-d.today.full span{color:#fff}
.ac-d.sel{background:rgba(255,255,255,.08)}
.ac-d b{position:absolute;bottom:2px;width:4px;height:4px;border-radius:50%;background:var(--orange)}
.ac-d:active{transform:scale(.92)}
.ac-lh{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;padding:0 2px}
.ac-lh b{display:block;font-size:17px;font-weight:700;letter-spacing:-.02em}
.ac-lh span{font-size:12.5px;color:var(--text2)}
.ac-lh em{font-style:normal;font-weight:700;font-size:14px;color:var(--text2);padding:4px 10px;border-radius:999px;background:rgba(255,255,255,.07);font-variant-numeric:tabular-nums}
.ac-lh em.ok{color:var(--green);background:rgba(48,209,88,.14)}
.ac-row{display:flex;align-items:center;gap:12px;width:100%;padding:11px 8px;border:0;background:none;color:var(--text);font:inherit;cursor:pointer;border-radius:14px;text-align:left;transition:background .2s}
.ac-row+.ac-row{box-shadow:0 -.5px 0 rgba(255,255,255,.08)}
.ac-row:active:not(:disabled){background:rgba(255,255,255,.06)}
.ac-row:disabled{cursor:default;opacity:.5}
.ac-chk{flex:none;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;box-shadow:inset 0 0 0 2px rgba(255,255,255,.22);color:transparent;transition:all .3s var(--spring)}
.ac-chk svg{width:15px;height:15px;stroke-width:3}
.ac-row.on .ac-chk{background:var(--ac);box-shadow:0 6px 14px -6px var(--ac);color:#fff;transform:scale(1.05)}
.ac-t{flex:1;font-weight:600;font-size:15px}
.ac-row.on .ac-t{color:var(--text2);text-decoration:line-through;text-decoration-color:rgba(255,255,255,.3)}
.ac-s{font-size:12.5px;color:var(--text3)}
.ac-row.on .ac-s{color:var(--green)}
.ac-ph{margin:12px 2px 4px;font-size:12px;font-weight:600;color:var(--text2)}
.ac-post{display:flex;align-items:center;gap:10px;width:100%;padding:10px;border:0;border-radius:14px;background:rgba(255,159,10,.1);color:var(--text);font:600 14px/1.3 inherit;font-family:inherit;cursor:pointer;text-align:left;margin-top:6px}
.ac-post svg{width:17px;height:17px;flex:none;color:var(--orange)}.ac-post span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ac-none{margin:6px 4px;font-size:13px;color:var(--text2)}
.ac-edit{height:48px;border-radius:999px}
html.light .ac-d span::before{background:conic-gradient(var(--ac) calc(var(--r)*360deg),rgba(118,118,128,.18) 0)}
html.light .ac-d.sel{background:rgba(118,118,128,.12)}
html.light .ac-chk{box-shadow:inset 0 0 0 2px rgba(60,60,67,.25)}
html.light .ac-row+.ac-row{box-shadow:0 -.5px 0 rgba(60,60,67,.12)}
html.light .ac-lh em{background:rgba(118,118,128,.12)}
html.light .ac-row.on .ac-t{text-decoration-color:rgba(0,0,0,.3)}

/* =========================================================
   Nach rechts wischen → Planen

.kplan-in{display:flex;flex-direction:column;align-items:center;gap:4px;width:96px;font-size:12px;font-weight:600;transition:transform .3s var(--spring)}
.kplan svg{width:20px;height:20px;transition:transform .35s var(--spring)}
.kcard.kright .kplan{opacity:1}
.kcard.kright .kdel{opacity:0!important;pointer-events:none!important}

.kcard.kparm .kplan-in{transform:translateX(6px)}
.kcard.kparm .kplan svg{transform:scale(1.25)}
.kghost .kplan{display:none}
/* Plan-Sheet */
.pl{display:flex;flex-direction:column;gap:16px;padding-bottom:6px}
.pl-vid{display:flex;align-items:center;gap:12px;padding:10px!important;border-radius:20px!important}
.pl-vid b{display:block;font-size:16px;font-weight:700;letter-spacing:-.02em}
.pl-vid span{font-size:13px;color:var(--text2)}
.pl-accs{display:flex;flex-wrap:wrap;gap:8px}
.pl-acc{display:inline-flex;align-items:center;gap:8px;height:44px;padding:0 14px 0 7px;border:0;border-radius:999px;cursor:pointer;color:var(--text);font:600 14px/1 inherit;font-family:inherit;
  background:var(--mg-hi);box-shadow:var(--mg-edge);transition:transform .3s var(--spring),background .25s,box-shadow .25s}
.pl-acc:active{transform:scale(.95)}
.pl-acc.on{background:color-mix(in srgb,var(--ac) 22%,transparent);box-shadow:inset 0 0 0 1.5px var(--ac),0 10px 22px -12px var(--ac)}
.pl-days{display:flex;gap:8px;overflow-x:auto;margin:0 -16px;padding:2px 16px 6px;scrollbar-width:none;scroll-snap-type:x proximity}
.pl-days::-webkit-scrollbar{display:none}
.pl-d{flex:none;scroll-snap-align:center;display:flex;flex-direction:column;align-items:center;gap:3px;width:54px;padding:9px 0 7px;border:0;border-radius:18px;cursor:pointer;color:var(--text);font-family:inherit;
  background:var(--mg-in);box-shadow:inset 0 0 0 .5px rgba(255,255,255,.08);transition:transform .3s var(--spring),background .2s}
.pl-d span{font-size:11px;font-weight:600;color:var(--text2)}
.pl-d b{font-size:20px;font-weight:700;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.pl-d i{height:14px;min-width:14px;padding:0 4px;border-radius:999px;font-style:normal;font-size:10px;font-weight:700;line-height:14px;color:#000;background:transparent}
.pl-d i:not(:empty){background:var(--orange)}
.pl-d.today span{color:var(--blue)}
.pl-d.on{background:var(--blue);box-shadow:0 10px 22px -12px var(--blue)}
.pl-d.on span,.pl-d.on b{color:#fff}
.pl-d:active{transform:scale(.94)}
.pl-other{position:relative;overflow:hidden;cursor:pointer}
.pl-other input{position:absolute;inset:0;opacity:0;cursor:pointer}
.pl-go{height:52px;border-radius:999px;font-size:15.5px;gap:8px}
.pl-go svg{width:18px;height:18px}
html.light .pl-d{box-shadow:none}

/* Pipeline: größere Video-Vorschau (9:16) */
.kthumb.big{width:68px;height:auto;aspect-ratio:9/16;border-radius:14px;box-shadow:0 10px 24px -14px rgba(0,0,0,.9),inset 0 0 0 .5px rgba(255,255,255,.12)}
.kthumb.big .kmini{transform:translate(-50%,-50%) scale(var(--ks,.2092))}
.kthumb.big .pl svg{width:18px;height:18px}
.kslide:has(.kthumb.big){padding:8px 12px 8px 8px;gap:14px}
@media(min-width:960px){.kthumb.big{width:84px}.kthumb.big .kmini{transform:translate(-50%,-50%) scale(var(--ks,.2585))}}
html.light .kthumb.big{box-shadow:0 8px 20px -12px rgba(30,40,80,.4)}

/* =========================================================
   Hype-Produkte: Stapel in der Karte + Auswahl im Editor
   ========================================================= */
.kbody{flex:1;min-width:0}
.kstack{flex:none;display:flex;align-items:center;padding-right:4px;margin-left:auto}
.ks-t{position:relative;z-index:calc(5 - var(--i));width:44px;height:44px;border-radius:13px;overflow:hidden;flex:none;display:grid;place-items:center;
  background:#2c2c2e;box-shadow:0 0 0 2.5px #1c1c1e,0 8px 18px -8px rgba(0,0,0,.8);
  transform:rotate(calc((var(--i) - 1) * 5deg)) translateY(calc(var(--i) * 1px));transition:transform .4s var(--spring)}
.ks-t+.ks-t{margin-left:-13px}
.ks-t img{width:100%;height:100%;object-fit:cover}
.ks-t em{color:#ff9f0a;display:grid}.ks-t em svg{width:18px;height:18px}
.kcard:hover .ks-t{transform:rotate(calc((var(--i) - 1) * 8deg)) translateX(calc(var(--i) * 3px))}
.ks-more{position:relative;z-index:0;margin-left:-10px;height:24px;min-width:24px;padding:0 7px 0 12px;border-radius:999px;display:grid;place-items:center;font-size:11.5px;font-weight:700;color:var(--text2);background:rgba(255,255,255,.1)}
@media(max-width:600px){.ks-t{width:36px;height:36px;border-radius:11px}.ks-t+.ks-t{margin-left:-11px}}
html.light .ks-t{background:#f2f2f7;box-shadow:0 0 0 2.5px #fff,0 6px 14px -8px rgba(30,40,80,.4)}
html.light .ks-more{background:rgba(118,118,128,.12)}
/* Auswahl im Editor */
.pp-grid{display:flex;gap:10px;overflow-x:auto;margin:0 -16px;padding:2px 16px 6px;scrollbar-width:none}
.pp-grid::-webkit-scrollbar{display:none}
.pp-t{flex:none;width:78px;display:flex;flex-direction:column;align-items:center;gap:6px;padding:0;border:0;background:none;color:var(--text);font-family:inherit;cursor:pointer}
.pp-img{position:relative;width:78px;height:78px;border-radius:18px;overflow:hidden;display:grid;place-items:center;background:var(--mg-in);box-shadow:inset 0 0 0 .5px rgba(255,255,255,.1);transition:transform .3s var(--spring),box-shadow .25s}
.pp-img img{width:100%;height:100%;object-fit:cover;transition:filter .25s}
.pp-img em{color:#ff9f0a;display:grid}.pp-img em svg{width:24px;height:24px}
.pp-img i{position:absolute;right:5px;top:5px;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;background:rgba(0,0,0,.35);box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.8);color:transparent;transition:all .25s var(--spring)}
.pp-img i svg{width:13px;height:13px;stroke-width:3}
.pp-t.on .pp-img{box-shadow:0 0 0 2.5px var(--blue),0 10px 22px -12px var(--blue);transform:scale(.96)}
.pp-t.on .pp-img i{background:var(--blue);box-shadow:none;color:#fff;transform:scale(1.1)}
.pp-n{width:100%;font-size:11.5px;font-weight:600;color:var(--text2);text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pp-t.on .pp-n{color:var(--text)}
.pp-t:active .pp-img{transform:scale(.9)}
.pp-empty{display:flex;align-items:center;gap:8px;margin:0;font-size:13px;color:var(--text2)}
.pp-empty svg{width:16px;height:16px;color:#ff9f0a}

/* Hype-Produkte: kompaktes Feld + Auswahl-Sheet für viele Produkte */
.pps{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.pps-t{position:relative;width:56px;height:56px;border-radius:16px;overflow:hidden;display:grid;place-items:center;cursor:pointer;background:var(--mg-in);box-shadow:inset 0 0 0 .5px rgba(255,255,255,.1);transition:transform .25s var(--spring);animation:ppsIn .35s var(--spring) both}
@keyframes ppsIn{from{transform:scale(.6);opacity:0}}
.pps-t img{width:100%;height:100%;object-fit:cover}
.pps-t em{color:#ff9f0a;display:grid}.pps-t em svg{width:20px;height:20px}
.pps-t i{position:absolute;top:4px;right:4px;width:18px;height:18px;border-radius:50%;display:grid;place-items:center;color:#fff;background:rgba(0,0,0,.55);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
.pps-t i svg{width:10px;height:10px;stroke-width:3}
.pps-t:active{transform:scale(.9)}
.pps-add{height:56px;padding:0 18px;border:0;border-radius:16px;display:inline-flex;align-items:center;gap:8px;font-family:inherit;font-size:14.5px;font-weight:600;color:var(--text);cursor:pointer;background:var(--mg-hi);box-shadow:var(--mg-edge);transition:transform .25s var(--spring)}
.pps-add svg{width:18px;height:18px;color:#ff9f0a}
.pps-add:active{transform:scale(.95)}
.pk{display:flex;flex-direction:column;gap:12px}
.pk-q{flex:none;background:var(--mg-in)!important;box-shadow:none!important}
.pk-cats{margin:0 -20px;padding:0 20px}
.pk-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:8px;padding-bottom:80px}
.pk-t{position:relative;aspect-ratio:1;border:0;padding:0;border-radius:16px;overflow:hidden;display:grid;place-items:center;cursor:pointer;font-family:inherit;background:var(--mg-in);box-shadow:inset 0 0 0 .5px rgba(255,255,255,.08);transition:transform .25s var(--spring),box-shadow .2s;content-visibility:auto;contain-intrinsic-size:auto 100px}
.pk-t img{width:100%;height:100%;object-fit:cover;transition:opacity .2s}
.pk-t em{color:#ff9f0a;display:grid}.pk-t em svg{width:24px;height:24px}
.pk-t i{position:absolute;top:6px;right:6px;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;color:transparent;background:rgba(0,0,0,.3);box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.85);transition:all .2s var(--spring)}
.pk-t i svg{width:13px;height:13px;stroke-width:3}
.pk-t span{position:absolute;left:0;right:0;bottom:0;padding:14px 6px 5px;font-size:11px;font-weight:600;color:#fff;text-align:left;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;background:linear-gradient(transparent,rgba(0,0,0,.6))}
.pk-t.on{box-shadow:0 0 0 3px var(--blue);transform:scale(.94)}
.pk-t.on i{background:var(--blue);box-shadow:none;color:#fff}
.pk-t:active{transform:scale(.9)}
.pk-bar{position:sticky;bottom:0;margin:-64px -20px 0;padding:24px 20px 4px;background:linear-gradient(transparent,var(--bg) 45%);pointer-events:none}
.pk-go{width:100%;height:52px;border-radius:999px;font-size:15.5px;pointer-events:auto}

/* =========================================================
   Inspo – Pinterest-Raster
   ========================================================= */
.ins-seg{margin-top:4px}
.ins-up:empty{display:none}
.ins-up{display:flex;gap:8px;margin-top:14px}
.ins-up .tile{width:84px;border-radius:16px}
.masonry{columns:2;column-gap:10px;margin-top:16px}
@media(min-width:700px){.masonry{columns:3;column-gap:14px}}
@media(min-width:1050px){.masonry{columns:4}}
.pin{break-inside:avoid;margin-bottom:14px;cursor:pointer;outline:none;animation:pinIn .5s var(--out,ease) both;animation-delay:var(--d,0ms)}
@keyframes pinIn{from{opacity:0;transform:translateY(14px) scale(.97)}}
.pin-m{position:relative;width:100%;border-radius:20px;overflow:hidden;background:var(--mg-in,#1c1c1e);box-shadow:inset 0 0 0 .5px rgba(255,255,255,.08);transform:translateZ(0);transition:transform .35s var(--spring),filter .25s}
.pin:active .pin-m{transform:scale(.96)}
@media(hover:hover){.pin:hover .pin-m{filter:brightness(1.08)}}
.pin-m img,.pin-m video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.pin-ph{position:absolute;inset:0;display:grid;place-items:center;color:var(--text3)}
.pin-ph svg{width:26px;height:26px}
.pin-m .kmini{position:absolute;left:50%;top:50%;width:325px;height:578px;border:0;pointer-events:none;transform-origin:50% 50%;transform:translate(-50%,-50%) scale(var(--ks,.5))}
.pin-m .ktt-sk{position:absolute;inset:0;display:grid;place-items:center;color:rgba(255,255,255,.85)}
.pin-m .ktt-sk svg{width:26px;height:26px;filter:drop-shadow(-1px -.8px 0 #25f4ee) drop-shadow(1px .8px 0 #fe2c55)}
.pin-m.tt::after{content:"";position:absolute;inset:0;pointer-events:none;border-radius:inherit;box-shadow:inset 0 0 0 .5px rgba(255,255,255,.1)}
.pin-play{position:absolute;left:9px;bottom:9px;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;color:#fff;background:rgba(0,0,0,.4);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
.pin-play svg{width:12px;height:12px;fill:currentColor}
.pin-src{position:absolute;top:9px;right:9px;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;color:var(--c);background:rgba(20,20,22,.55);-webkit-backdrop-filter:blur(14px) saturate(1.6);backdrop-filter:blur(14px) saturate(1.6);box-shadow:inset 0 0 0 .5px rgba(255,255,255,.18)}
.pin-src svg{width:14px;height:14px}
.pin-c{padding:7px 4px 0;font-size:13px;font-weight:600;line-height:1.3;color:var(--text);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
html.light .pin-m{background:#ececf0;box-shadow:none}
/* Hinzufügen-Sheet */
.ia-grid{display:flex;flex-wrap:wrap;gap:8px}
.ia-grid:has(.ia-t,.tile){margin-bottom:10px}
.ia-grid .up-slot{display:contents}
.ia-grid .tile{width:72px;border-radius:14px}
.ia-t{position:relative;width:72px;aspect-ratio:3/4;border-radius:14px;overflow:hidden;display:grid;place-items:center;background:var(--mg-in);color:var(--text3);animation:ppsIn .35s var(--spring) both}
.ia-t img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.ia-t i{position:absolute;left:5px;bottom:5px;width:20px;height:20px;border-radius:50%;display:grid;place-items:center;color:#fff;background:rgba(0,0,0,.45)}
.ia-t i svg{width:10px;height:10px;fill:currentColor}
.ia-pick{width:100%;display:flex;align-items:center;gap:14px;padding:14px 16px;border:0;border-radius:18px;cursor:pointer;text-align:left;font-family:inherit;color:var(--text);background:var(--mg-hi);box-shadow:var(--mg-edge);transition:transform .25s var(--spring)}
.ia-pick:active{transform:scale(.97)}
.ia-pick>svg{width:22px;height:22px;color:var(--blue);flex:none}
.ia-pick b{display:block;font-size:15px;font-weight:600}
.ia-pick small{font-size:12.5px;color:var(--text2)}
.ins-cap{border:0!important;background:transparent!important;box-shadow:none!important;font-size:16px;font-weight:600;padding:4px 2px!important}

/* =========================================================
   Erinnerungen
   ========================================================= */
.nt-bell .nt-dot{position:absolute;top:6px;right:6px;min-width:15px;height:15px;padding:0 3px;border-radius:999px;font-size:9.5px;font-weight:800;line-height:15px;text-align:center;color:#fff;background:var(--red,#ff453a);box-shadow:0 0 0 2px var(--bg);transform:scale(0);transition:transform .35s var(--spring)}
.nt-bell.has .nt-dot{transform:scale(1)}
.nt-bell.has svg{animation:ntRing 1.2s var(--out,ease) .3s 2}
@keyframes ntRing{0%,100%{transform:rotate(0)}15%{transform:rotate(14deg)}30%{transform:rotate(-12deg)}45%{transform:rotate(8deg)}60%{transform:rotate(-4deg)}}
#ntb{position:fixed;z-index:400;left:50%;top:calc(env(safe-area-inset-top) + 10px);width:min(420px,calc(100% - 20px));display:flex;align-items:center;gap:12px;padding:12px 14px;border:0;border-radius:24px;text-align:left;cursor:pointer;font-family:inherit;color:var(--text);
  background:rgba(40,40,44,.72);-webkit-backdrop-filter:blur(30px) saturate(1.8);backdrop-filter:blur(30px) saturate(1.8);box-shadow:inset 0 0 0 .5px rgba(255,255,255,.16),0 20px 50px -14px rgba(0,0,0,.7);
  transform:translate(-50%,-140%);opacity:0;transition:transform .55s var(--spring),opacity .3s}
#ntb.show{transform:translate(-50%,0);opacity:1}
html.light #ntb{background:rgba(255,255,255,.8);box-shadow:inset 0 0 0 .5px rgba(0,0,0,.06),0 20px 50px -18px rgba(30,40,80,.4)}
.ntb-ic{flex:none;width:38px;height:38px;border-radius:11px;display:grid;place-items:center;color:#fff;background:linear-gradient(135deg,#ff9f0a,#ff375f)}
.ntb-ic svg{width:19px;height:19px}
.ntb-t{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.ntb-t b{font-size:14.5px;font-weight:700}
.ntb-t small{font-size:13px;color:var(--text2);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.ntb-now{align-self:flex-start;font-size:11.5px;color:var(--text3)}
.nt{padding-bottom:8px}
.nt-now{display:flex;align-items:center;gap:16px;padding:16px!important;border-radius:22px!important}
.nt-ring{--p:0;flex:none;width:70px;height:70px;border-radius:50%;display:flex;align-items:baseline;justify-content:center;padding-top:22px;background:conic-gradient(var(--green,#30d158) calc(var(--p)*1%),rgba(255,255,255,.1) 0);-webkit-mask:radial-gradient(farthest-side,transparent 0 0,#000 0);position:relative}
.nt-ring::before{content:"";position:absolute;inset:6px;border-radius:50%;background:var(--surface,#1c1c1e)}
.nt-ring b,.nt-ring span{position:relative;font-variant-numeric:tabular-nums}
.nt-ring b{font-size:22px;font-weight:800;letter-spacing:-.03em}
.nt-ring span{font-size:13px;color:var(--text2);font-weight:600}
.nt-nt{min-width:0;display:flex;flex-direction:column;gap:4px}
.nt-nt b{font-size:17px;font-weight:700;letter-spacing:-.02em}
.nt-nt span{font-size:13px;color:var(--text2)}
.nt-r{cursor:default}
.nt-r .t{min-width:0}
.nt-r.off .ficon,.nt-r.off .t,.nt-r.off .nt-time{opacity:.45}
.nt-time{flex:none;width:auto;height:34px;padding:0 10px;border:0;border-radius:10px;font:600 15px/1 inherit;font-family:inherit;font-variant-numeric:tabular-nums;color:var(--text);background:var(--fill2,rgba(118,118,128,.24));color-scheme:dark}
html.light .nt-time{color-scheme:light}
.nt-time::-webkit-calendar-picker-indicator{display:none}
.nt-sw{flex:none;position:relative;width:51px;height:31px;border:0;padding:0;border-radius:999px;cursor:pointer;background:rgba(120,120,128,.32);transition:background .25s}
.nt-sw i{position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:50%;background:#fff;box-shadow:0 3px 8px rgba(0,0,0,.25);transition:transform .35s var(--spring)}
.nt-sw.on{background:var(--green,#30d158)}
.nt-sw.on i{transform:translateX(20px)}
.nt-sw:disabled{opacity:.4;cursor:not-allowed}
.nt-log small{flex:none;align-self:flex-start;font-size:12px;color:var(--text3)}
/* Nichts markierbar außer Eingaben · kein Zoom */
html{-webkit-text-size-adjust:100%;text-size-adjust:100%;touch-action:manipulation}
html,body,body *{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
input,textarea,select,[contenteditable],[contenteditable] *{-webkit-user-select:text!important;user-select:text!important;-webkit-touch-callout:default!important}
input,textarea,select{font-size:max(16px,1em)}
img,video{-webkit-user-drag:none}
/* Inspo: Notiz-Pins für Ideen & Produkte ohne Bild */
.pin-m.note{display:flex;flex-direction:column;gap:6px;padding:14px 14px 16px;min-height:120px;background:linear-gradient(160deg,color-mix(in srgb,var(--ac,#0a84ff) 34%,#1c1c1e),#1c1c1e 85%)}
html.light .pin-m.note{background:linear-gradient(160deg,color-mix(in srgb,var(--ac,#0a84ff) 22%,#fff),#fff 85%);box-shadow:inset 0 0 0 .5px rgba(0,0,0,.06)}
.pn-k{display:inline-flex;align-items:center;gap:4px;align-self:flex-start;height:22px;padding:0 9px;border-radius:999px;font-size:11px;font-weight:700;color:var(--ac,#0a84ff);background:color-mix(in srgb,var(--ac,#0a84ff) 18%,transparent)}
.pn-k svg{width:12px;height:12px}
.pn-t{font-size:16px;font-weight:700;letter-spacing:-.02em;line-height:1.25;color:var(--text)}
.pn-h{font-size:13px;line-height:1.35;color:var(--text2);display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}
.pin-lk{position:absolute;left:50%;bottom:12px;transform:translateX(-50%);font-size:11px;font-weight:600;color:var(--text2);white-space:nowrap}

@media(max-width:600px){.ins-seg .seg[style*="--n:5"] .n{display:none}.ins-seg .seg[style*="--n:5"] button{padding:0 2px}}
.pv-info.tap{position:relative;cursor:pointer;padding-right:40px!important;transition:transform .3s var(--spring),background .2s}
.pv-info.tap::after{content:"";position:absolute;right:18px;top:50%;width:8px;height:8px;border-top:2px solid var(--text3);border-right:2px solid var(--text3);transform:translateY(-50%) rotate(45deg)}
.pv-info.tap:active{transform:scale(.97)}
/* ---------- Cloud-Sync (Supabase) ---------- */
.cs .cs-in{display:flex;flex-direction:column;gap:12px;padding:14px 16px 16px;margin:0}
.cs .cs-hd{display:flex;gap:12px;align-items:flex-start}
.cs .cs-hd .t{flex:1;min-width:0}
.cs .cs-hd .t b{display:block;font-weight:600;font-size:15px}
.cs .cs-hd .t span{display:block;margin-top:2px;font-size:13px;line-height:1.35;color:var(--text2)}
.cs .cs-hd .t span b{display:inline;font-weight:600;font-size:inherit;color:var(--text)}
.cs-ic{background:linear-gradient(135deg,#0a84ff,#64d2ff)!important;color:#fff!important}
.cs-ic.on{background:linear-gradient(135deg,#30d158,#0a84ff)!important}
.cs-ic.busy svg{animation:csPulse 1.1s ease-in-out infinite}
@keyframes csPulse{50%{opacity:.35}}
.cs .cs-row{display:flex;gap:8px}
.cs .cs-row .inp{flex:1;min-width:0;letter-spacing:.14em;font-variant-numeric:tabular-nums}
.cs .cs-row .inp::placeholder{letter-spacing:normal}
.cs .cs-row .btn{flex:none;height:auto;min-height:48px}
.cs .cs-links{display:flex;justify-content:space-between;padding:0 2px}
.cs .cs-links .sec-a{font-size:14px;color:var(--blue)}
.cs .btn[disabled]{opacity:.55;pointer-events:none}
.cs .frow{position:relative}

let state=Store.load()||seed();
function normalize(){

  if(!Array.isArray(state.styles))state.styles=[];state.styles=state.styles.filter(s=>s&&s.v&&s.l);
  if(state.ui.style!=='all'&&!state.styles.some(s=>s.v===state.ui.style))state.ui.style='all';

}

/* ---------------- Media DB (IndexedDB) ---------------- */
const MediaDB={
  db:null,mem:new Map(),
  open(){return new Promise((res,rej)=>{try{const r=indexedDB.open('fleet-media',1);r.onupgradeneeded=()=>r.result.createObjectStore('media',{keyPath:'id'});r.onsuccess=()=>{this.db=r.result;res()};r.onerror=()=>rej(r.error)}catch(e){rej(e)}})},
  tx(mode){return this.db.transaction('media',mode).objectStore('media')},
  req(r){return new Promise((res,rej)=>{r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})},
  async put(rec){if(!this.db){this.mem.set(rec.id,rec);return}return this.req(this.tx('readwrite').put(rec))},
  async get(id){if(!this.db)return this.mem.get(id);return this.req(this.tx('readonly').get(id))},
  async del(id){if(!this.db){this.mem.delete(id);return}return this.req(this.tx('readwrite').delete(id))},
  async all(){if(!this.db)return[...this.mem.values()];return this.req(this.tx('readonly').getAll())},
  async clear(){if(!this.db){this.mem.clear();return}return this.req(this.tx('readwrite').clear())}
};

function checks(day,a){const arr=((state.checkins[day]||{})[a.id]||[]).slice(0,a.target);while(arr.length<a.target)arr.push(false);return arr}
const doneCount=(day,a)=>checks(day,a).filter(Boolean).length;
const countable=list=>(list||state.accounts).filter(a=>a.status!=='paused');
function dayComplete(day){const as=countable();return as.length>0&&as.every(a=>doneCount(day,a)>=a.target)}
function streak(){let n=0,k=addDays(dkey(),-1);while(n<999&&dayComplete(k)){n++;k=addDays(k,-1)}if(dayComplete(dkey()))n++;return n}
function accState(a){if(a.status==='paused')return'paused';const d=doneCount(dkey(),a);return d>=a.target?'done':d>0?'part':'none'}
function usedSet(){const s=new Set();for(const k of ['posts','ideas','products'])state[k].forEach(x=>(x.media||[]).forEach(id=>s.add(id)));return s}
function ownerOf(mid){for(const [k,kind] of [['posts','post'],['ideas','idea'],['products','product']]){const o=state[k].find(x=>(x.media||[]).includes(mid));if(o)return{kind,id:o.id}}return null}

const tagS=st=>st?`<span class="tag" style="--c:${st.c}">${esc(st.l)}</span>`:'';
function ring(p,size,stroke,color,inner='',from){
  const r=(size-stroke)/2,c=2*Math.PI*r,cl=x=>Math.max(0,Math.min(1,x)),to=c*(1-cl(p)),f=from==null?to:c*(1-cl(from));
  return `<div class="ring" style="width:${size}px;height:${size}px"><svg viewBox="0 0 ${size} ${size}"><circle class="ring-bg" cx="${size/2}" cy="${size/2}" r="${r}" stroke-width="${stroke}"/><circle class="ring-fg" cx="${size/2}" cy="${size/2}" r="${r}" stroke="${color}" stroke-width="${stroke}" stroke-dasharray="${c}" style="stroke-dashoffset:${f}" data-to="${to}"/></svg><div class="ring-in">${inner}</div></div>`;
}

function vseg(key,opts,cur,act){const idx=Math.max(0,opts.findIndex(o=>o.v===cur));const from=segMem[key]??idx;
  return `<div class="seg" data-seg="${key}" data-cur="${idx}" style="--n:${opts.length};--i:${from}">${opts.map(o=>`<button class="${o.v===cur?'on':''}" data-act="${act}" data-v="${o.v}">${esc(o.l)}${o.n!=null?`<span class="n">${o.n}</span>`:''}</button>`).join('')}</div>`}

function runCounters(){$$('[data-count]').forEach(el=>{const k=el.dataset.ck,to=+el.dataset.count,from=countMem[k]??0;countMem[k]=to;if(from===to||reduced){el.textContent=to;return}
  const t0=performance.now(),d=750;const step=t=>{const p=Math.min(1,(t-t0)/d),e=1-Math.pow(1-p,3);el.textContent=Math.round(from+(to-from)*e);if(p<1)requestAnimationFrame(step)};requestAnimationFrame(step)})}

const blob2du=b=>new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=rej;r.readAsDataURL(b)});
function du2blob(du){const [h,b64]=du.split(',');const mime=(h.match(/data:([^;]+)/)||[])[1]||'application/octet-stream';const bin=atob(b64);const u=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);return new Blob([u],{type:mime})}

  if(dlNS===undefined){try{dlNS=window.claude?.use?await window.claude.use('downloads'):null}catch(e){dlNS=null}}
  if(dlNS){try{await dlNS.save({filename,data:blob});toast('Gespeichert','download')}catch(e){if(e?.code!=='declined')toast(e?.code==='rejected_extension'?'Dateiformat hier nicht speicherbar':'Speichern nicht möglich','x')}return}
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=filename;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),2000);toast('Gespeichert','download');

document.addEventListener('pointerdown',e=>{const el=e.target.closest('.btn,.slot,.chip,.icon-btn,.mitem,.tgl,.sw,.qa-b .c');if(!el||reduced)return;
  const r=el.getBoundingClientRect(),s=Math.max(r.width,r.height)*2.2,sp=document.createElement('span');sp.className='ripple';
  sp.style.cssText=`width:${s}px;height:${s}px;left:${e.clientX-r.left-s/2}px;top:${e.clientY-r.top-s/2}px`;el.appendChild(sp);setTimeout(()=>sp.remove(),650)});

/* ---------------- Confetti (monochrom) ---------------- */
const Confetti=(()=>{
  const c=$('#confetti'),ctx=c.getContext('2d');let parts=[],raf=null;
  const CL=['#0a84ff','#30d158','#111111','#0a84ff','#30d158','#d4d4d8'];
  function resize(){const d=Math.min(2,devicePixelRatio||1);c.width=innerWidth*d;c.height=innerHeight*d;ctx.setTransform(d,0,0,d,0,0)}
  addEventListener('resize',resize);resize();
  function add(x,y,vx,vy,i){parts.push({x,y,vx,vy,g:.3,r:Math.random()*6,vr:(Math.random()-.5)*.35,w:5+Math.random()*7,h:3+Math.random()*4,c:CL[i%CL.length],life:1,dec:.007+Math.random()*.008,circ:Math.random()<.35})}
  function burst(x,y,n=40,pw=1){if(reduced)return;for(let i=0;i<n;i++){const a=Math.random()*Math.PI*2,s=(3+Math.random()*9)*pw;add(x,y,Math.cos(a)*s,Math.sin(a)*s-5*pw,i)}run()}
  function rain(n=150){if(reduced)return;for(let i=0;i<n;i++)add(Math.random()*innerWidth,-20-Math.random()*220,(Math.random()-.5)*4,Math.random()*4+2,i);run()}
  function run(){if(!raf)raf=requestAnimationFrame(loop)}
  function loop(){ctx.clearRect(0,0,innerWidth,innerHeight);parts=parts.filter(p=>p.life>0&&p.y<innerHeight+40);
    for(const p of parts){p.vx*=.985;p.vy=p.vy*.99+p.g;p.x+=p.vx;p.y+=p.vy;p.r+=p.vr;p.life-=p.dec;ctx.save();ctx.globalAlpha=Math.max(0,Math.min(1,p.life*1.4));ctx.translate(p.x,p.y);ctx.rotate(p.r);ctx.fillStyle=p.c;if(p.circ){ctx.beginPath();ctx.arc(0,0,p.w/2.4,0,7);ctx.fill()}else ctx.fillRect(-p.w/2,-p.h/2,p.w,p.h);ctx.restore()}
    raf=parts.length?requestAnimationFrame(loop):(ctx.clearRect(0,0,innerWidth,innerHeight),null)}
  return{burst,rain};
})();

const ringMem={};

/* --- Abgleich mit der Cloud --- */
async function cloudSync(why='',depth=0){
  if(!Cloud.sb||!Cloud.user||depth>3)return;
  if(Cloud.hold&&!['manual','login'].includes(why))return;
  if(Cloud.busy){Cloud.again=true;return}
  if(cloudUIBusy()){clearTimeout(Cloud.syncT);Cloud.syncT=setTimeout(()=>cloudSync(why,depth),2500);return}
  Cloud.busy=true;Cloud.hold=false;cloudSet('sync');let after='';
  try{
    const uid=Cloud.user.id,T=()=>Cloud.sb.from('fleet_state');
    const {data:meta,error}=await T().select('version,updated_at').eq('user_id',uid).maybeSingle();
    if(error)throw error;
    Cloud.lastCheck=Date.now();
    const p=cloudPayload(state),h=cloudHash(p);
    if(!meta){
      /* Noch keine Zeile: den LOKALEN Stand hochladen */
      const {data,error:e}=await T().insert({user_id:uid,data:p}).select('version,updated_at').single();
      if(e){if(e.code==='23505')after='sync';else throw e}
      else{cloudMark(data,h);toast('Daten in der Cloud gesichert','cloud')}
    }else if(cloudLinked()&&meta.version===state.syncMeta.ver&&meta.updated_at===state.syncedAt){
      /* Cloud unverändert seit dem letzten Sync */
      if(h!==state.syncMeta.hash)after='push';
    }else{
      const {data:row,error:e}=await T().select('data,version,updated_at').eq('user_id',uid).single();
      if(e)throw e;
      if(isEmptyData(row.data)){

      }else{

        if(ch===h)cloudMark(row,h);
        else if(cloudLinked()&&h===state.syncMeta.hash)cloudApply(row,cand,false);   // nur die Cloud ist neuer
        else if(!cloudLinked()&&isEmptyData(p))cloudApply(row,cand,true);           // Gerät ist leer
        else{                                                                         // echter Konflikt
          const c=await cloudAsk(cloudLinked()?'conflict':'first',row);
          if(c==='cloud')cloudApply(row,cloudBuild(row.data),true);
          else if(c==='local'){cloudBackup(row.data,'cloud',row.updated_at);after='force:'+row.version}
          else Cloud.hold=true;

      }
    }
  }catch(e){cloudErr(e)}

  if(after==='sync')return cloudSync(why,depth+1);
  if(after==='push')await cloudPush();
  else if(after.startsWith('force:'))await cloudPush(+after.slice(6),depth);
  if(Cloud.hold)cloudSet('hold');else if(Cloud.st==='sync')cloudSet('ok');

async function cloudPush(forceVer,depth=0){

  if(forceVer==null&&!cloudLinked())return cloudSync('link',depth);
  const p=cloudPayload(state),h=cloudHash(p);
  if(forceVer==null&&h===state.syncMeta.hash){cloudDelFlush();return}
  Cloud.busy=true;cloudSet('sync');let stale=false;
  try{
    const {data,error}=await Cloud.sb.from('fleet_state').update({data:p}).eq('user_id',Cloud.user.id).eq('version',forceVer??state.syncMeta.ver).select('version,updated_at');
    if(error)throw error;

  }catch(e){cloudErr(e)}

/* --- Medien: fleet-media/{user_id}/{media_id} + {media_id}.thumb --- */
const mPath=(id,th)=>Cloud.user.id+'/'+id+(th?'.thumb':'');
function cloudRefs(){const s=new Set();state.media.forEach(m=>m&&m.id&&s.add(m.id));state.accounts.forEach(a=>a&&a.avatar&&s.add(a.avatar));
  for(const k of ['posts','ideas','products'])state[k].forEach(x=>(x.media||[]).forEach(id=>id&&s.add(id)));return s}
async function cloudList(){const uid=Cloud.user.id,set=new Set();let off=0;
  for(;;){const {data,error}=await Cloud.sb.storage.from(SB_BUCKET).list(uid,{limit:1000,offset:off,sortBy:{column:'name',order:'asc'}});
    if(error)throw error;(data||[]).forEach(o=>{if(o&&o.id)set.add(o.name)});if(!data||data.length<1000)break;off+=data.length}
  if(Cloud.user&&Cloud.user.id===uid)Cloud.remote=set;return set}
async function cloudUp(r){const S=Cloud.sb.storage.from(SB_BUCKET);
  if(r.blob.size>SB_MAX){Cloud.skip.add(r.id);Cloud.mBig++;return}
  if(!Cloud.remote.has(r.id)){const {error}=await S.upload(mPath(r.id),r.blob,{upsert:true,contentType:r.blob.type||'application/octet-stream',cacheControl:'31536000'});if(error)throw error;Cloud.remote.add(r.id)}
  if(r.thumb&&!Cloud.remote.has(r.id+'.thumb')){const {error}=await S.upload(mPath(r.id,1),r.thumb,{upsert:true,contentType:r.thumb.type||'image/jpeg',cacheControl:'31536000'});if(error)throw error;Cloud.remote.add(r.id+'.thumb')}}
async function cloudDown(id){const S=Cloud.sb.storage.from(SB_BUCKET);
  const {data:blob,error}=await S.download(mPath(id));if(error)throw error;
  let thumb=null;if(Cloud.remote.has(id+'.thumb')){const t=await S.download(mPath(id,1));if(!t.error)thumb=t.data}
  const rec={id,blob,thumb};if(state.accounts.some(a=>a.avatar===id))rec.kind='avatar';
  await MediaDB.put(rec);
  const o=urls[id];if(o){o.full&&URL.revokeObjectURL(o.full);o.thumb&&URL.revokeObjectURL(o.thumb)}
  urls[id]={full:URL.createObjectURL(blob),thumb:thumb?URL.createObjectURL(thumb):null}}
async function cloudMedia(force){
  if(!Cloud.sb||!Cloud.user)return;
  if(Cloud.mBusy){Cloud.mAgain=true;return}
  Cloud.mBusy=true;const uid=Cloud.user.id;
  try{
    const remote=(!Cloud.remote||force)?await cloudList():Cloud.remote;
    const refs=cloudRefs(),local=new Map();
    (await MediaDB.all()).forEach(r=>{if(r&&r.blob)local.set(r.id,r)});
    const up=[],down=[];let miss=0;
    refs.forEach(id=>{const r=local.get(id);
      if(r){if(!Cloud.skip.has(id)&&(!remote.has(id)||(r.thumb&&!remote.has(id+'.thumb'))))up.push(['up',r])}
      else if(remote.has(id))down.push(['down',id]);else miss++});
    const q=[...up,...down];
    if(q.length){
      Object.assign(Cloud,{mTotal:q.length,mDone:0,mFail:0,mUp:up.length,mDown:down.length});csStatus();
      let got=0;
      const work=async()=>{while(q.length&&Cloud.user&&Cloud.user.id===uid){const [k,x]=q.shift();
        try{if(k==='up')await cloudUp(x);else{await cloudDown(x);got++}}catch(e){Cloud.mFail++;console.warn('Medien-Sync',k,e)}
        Cloud.mDone++;csStatus()}};
      await Promise.all([work(),work(),work()]);
      if(got)cloudRender();
      const ok=Cloud.mDone-Cloud.mFail;
      if(Cloud.mFail)toast(`${Cloud.mFail} ${Cloud.mFail===1?'Datei':'Dateien'} nicht synchronisiert – wird wiederholt`,'x');
      else if(up.length>=3)toast(`${ok} Medien in der Cloud gesichert`,'cloud');
      else if(down.length>=3)toast(`${down.length} Medien aus der Cloud geladen`,'cloud');
      await sleep(500);Cloud.mTotal=0;csStatus();
    }
    /* Datei fehlt noch überall? Evtl. lädt ein anderes Gerät sie gerade hoch → später erneut nachsehen */
    if(miss&&Cloud.mRetry<4){Cloud.mRetry++;setTimeout(()=>cloudMedia(true),20000*Cloud.mRetry)}
  }catch(e){cloudErr(e)}
  finally{Cloud.mBusy=false;Cloud.mTotal=0;csStatus();if(Cloud.mAgain){Cloud.mAgain=false;setTimeout(()=>cloudMedia(),400)}}
}

  if(!Cloud.sb||!Cloud.user||Cloud.dBusy||!cloudLinked())return;

const uploads=new Map();
const uploadsFor=key=>[...uploads.values()].filter(u=>u.key===key);
const uploadTiles=key=>uploadsFor(key).map(u=>`<div class="tile uploading" id="up-${u.id}" style="--p:${u.p}">${u.preview?`<img src="${u.preview}" alt="">`:''}<div class="upring"></div><div class="uppct">${Math.round(u.p*100)}%</div></div>`).join('');
function refreshUploads(key){$$(`.up-slot[data-upkey="${key}"]`).forEach(s=>s.innerHTML=uploadTiles(key))}
function setP(u,p){u.p=p;const el=document.getElementById('up-'+u.id);if(el){el.style.setProperty('--p',p);const t=$('.uppct',el);if(t)t.textContent=Math.round(p*100)+'%'}}
function pickFiles(cb,accept='image/*,video/*',multiple=true){const inp=$('#filepick');inp.accept=accept;inp.multiple=multiple;inp.value='';inp.onchange=()=>{if(inp.files.length)cb([...inp.files])};inp.click()}
function libraryAdded(){if(['studio','today'].includes(state.ui.view)&&!sheets.length)renderView(false);renderNav()}
async function ingest(files,key,onAdded,opts={}){
  files=files.filter(f=>/^(image|video)\//.test(f.type));
  if(!files.length){toast('Nur Videos & Bilder','x');return}
  try{navigator.storage?.persist?.()}catch(e){}
  const queue=[...files];let added=0;
  const worker=async()=>{while(queue.length){const f=queue.shift();const id=await processFile(f,key,opts);if(id){added++;onAdded&&onAdded(id)}}};
  await Promise.all([worker(),worker(),worker()]);
  if(added){haptic(10);toast(`${added} ${added===1?'Datei':'Dateien'} hochgeladen`,'upload')}
}
async function processFile(file,key,opts={}){
  const isImg=file.type.startsWith('image/');
  const u={id:uid(),key,p:0,preview:isImg?URL.createObjectURL(file):null};
  uploads.set(u.id,u);refreshUploads(key);
  let fake=0;const tick=setInterval(()=>{fake+=(0.9-fake)*0.25;setP(u,fake)},40);
  try{
    const meta={id:u.id,name:file.name||'Datei',type:isImg?'image':'video',mime:file.type,size:file.size,created:Date.now()};
    let th;if(isImg){try{th=await imageFast(file,opts.maxFull)}catch(e){th=await imageThumb(file)}}else th=await videoThumb(file);const store=th.big||file;if(th.big){meta.size=th.big.size;meta.mime='image/jpeg'}
    if(!isImg&&th.blob){u.preview=URL.createObjectURL(th.blob);const el=document.getElementById('up-'+u.id);if(el&&!$('img',el))el.insertAdjacentHTML('afterbegin',`<img src="${u.preview}" alt="">`)}
    Object.assign(meta,{w:th.w,h:th.h,duration:th.duration});
    await MediaDB.put({id:u.id,blob:store,thumb:th.blob||null});
    urls[u.id]={full:URL.createObjectURL(store),thumb:th.blob?URL.createObjectURL(th.blob):null};
    state.media.unshift(meta);save();
    clearInterval(tick);setP(u,1);await sleep(opts.fast?0:120);
    return u.id;
  }catch(err){console.error(err);toast('Upload fehlgeschlagen: '+(file.name||''),'x');return null}
  finally{clearInterval(tick);uploads.delete(u.id);if(u.preview)URL.revokeObjectURL(u.preview);refreshUploads(key)}
}
function loadImg(file){return new Promise((res,rej)=>{const img=new Image(),src=URL.createObjectURL(file);img.onload=()=>{URL.revokeObjectURL(src);res(img)};img.onerror=()=>{URL.revokeObjectURL(src);rej(new Error('img'))};img.src=src})}
async function decodeImg(file){if(window.createImageBitmap){try{const b=await createImageBitmap(file);return{img:b,w:b.width,h:b.height,close:()=>b.close&&b.close()}}catch(e){}}const i=await loadImg(file);return{img:i,w:i.naturalWidth,h:i.naturalHeight,close:()=>{}}}
function scaleTo(d,max,q){const s=Math.min(1,max/Math.max(d.w,d.h));const c=document.createElement("canvas");c.width=Math.max(1,Math.round(d.w*s));c.height=Math.max(1,Math.round(d.h*s));c.getContext("2d").drawImage(d.img,0,0,c.width,c.height);return new Promise(r=>c.toBlob(r,"image/jpeg",q))}
async function imageFast(file,full){const d=await decodeImg(file);try{const thumb=await scaleTo(d,480,.82);let big=null;if(full&&(Math.max(d.w,d.h)>full||file.size>1.5e6))big=await scaleTo(d,full,.86);return{blob:thumb,big,w:d.w,h:d.h}}finally{d.close()}}
async function imageThumb(file){try{const img=await loadImg(file);const max=720,s=Math.min(1,max/Math.max(img.naturalWidth,img.naturalHeight));const c=document.createElement('canvas');c.width=Math.max(1,Math.round(img.naturalWidth*s));c.height=Math.max(1,Math.round(img.naturalHeight*s));
  c.getContext('2d').drawImage(img,0,0,c.width,c.height);const blob=await new Promise(r=>c.toBlob(r,'image/jpeg',.84));return{blob,w:img.naturalWidth,h:img.naturalHeight}}catch(e){return{blob:null}}}
async function squareImage(file,size=400){const img=await loadImg(file);const s=Math.min(img.naturalWidth,img.naturalHeight);const c=document.createElement('canvas');c.width=c.height=size;
  c.getContext('2d').drawImage(img,(img.naturalWidth-s)/2,(img.naturalHeight-s)/2,s,s,0,0,size,size);return new Promise(r=>c.toBlob(r,'image/jpeg',.88))}
function videoThumb(file){return new Promise(res=>{const v=document.createElement('video'),src=URL.createObjectURL(file);let done=false;
  const fin=r=>{if(done)return;done=true;URL.revokeObjectURL(src);v.removeAttribute('src');res(r)};
  setTimeout(()=>fin({blob:null,duration:v.duration||0}),9000);
  v.muted=true;v.playsInline=true;v.preload='auto';
  v.onloadedmetadata=()=>{try{v.currentTime=Math.min(.6,(v.duration||1)/3)}catch(e){fin({blob:null})}};
  v.onseeked=()=>{const max=720,w=v.videoWidth||360,h=v.videoHeight||640,s=Math.min(1,max/Math.max(w,h));const c=document.createElement('canvas');c.width=Math.round(w*s);c.height=Math.round(h*s);
    try{c.getContext('2d').drawImage(v,0,0,c.width,c.height);c.toBlob(b=>fin({blob:b,w,h,duration:v.duration}),'image/jpeg',.8)}catch(e){fin({blob:null,w,h,duration:v.duration})}};
  v.onerror=()=>fin({blob:null});v.src=src;v.load()})}

const sheets=[];let sheetDrag=false;
function openSheet({title='',body='',left,right='',onMount,onClose,cls=''}){
  const root=document.createElement('div');root.className='sheet-wrap';
  root.innerHTML=`<div class="sheet-bd"></div><div class="sheet ${cls}" role="dialog" aria-modal="true" aria-label="${esc(title)}"><div class="sheet-head"><div class="grabber"></div><div class="sheet-bar"><div class="sb-l">${left??'<button class="txt-btn muted" data-close>Abbrechen</button>'}</div><div class="sb-t">${esc(title)}</div><div class="sb-r">${right}</div></div></div><div class="sheet-body">${body}</div></div>`;
  document.body.appendChild(root);document.documentElement.classList.add('locked');
  const api={root,el:$('.sheet',root),onClose,onFiles:null,close:()=>closeSheet(api)};sheets.push(api);
  root.addEventListener('click',e=>{
    if(e.target.closest('[data-close]')||e.target.classList.contains('sheet-bd')){api.close();return}
    const ch=e.target.closest('[data-choice]');if(ch){const g=ch.closest('[data-group]');
      if(g.dataset.multi)ch.classList.toggle('on');else if(g.dataset.toggle&&ch.classList.contains('on'))ch.classList.remove('on');else $$('[data-choice]',g).forEach(b=>b.classList.toggle('on',b===ch));
      if(g.classList.contains('seg'))g.style.setProperty('--i',$$('[data-choice]',g).indexOf(ch));
      haptic(5);g.dispatchEvent(new Event('choice'))}
  });
  const head=$('.sheet-head',root);let sy=null,dy=0,st=0;
  head.addEventListener('pointerdown',e=>{if(matchMedia('(min-width:760px)').matches||e.target.closest('button'))return;sy=e.clientY;dy=0;st=performance.now();api.el.style.transition='none';sheetDrag=true;head.setPointerCapture(e.pointerId)});
  head.addEventListener('pointermove',e=>{if(sy==null)return;dy=Math.max(0,e.clientY-sy);api.el.style.transform=`translateY(${dy}px)`});
  const up=()=>{if(sy==null)return;sy=null;sheetDrag=false;api.el.style.transition='';const v=dy/(performance.now()-st);if(dy>120||v>.7)api.close();else api.el.style.transform=''};
  head.addEventListener('pointerup',up);head.addEventListener('pointercancel',up);
  requestAnimationFrame(()=>requestAnimationFrame(()=>root.classList.add('open')));
  onMount&&onMount(api);
  $$('textarea.autosize',root).forEach(autosize);
  return api;
}
function closeSheet(api){if(api.closing)return;api.closing=true;api.root.classList.remove('open');api.el.style.transform='';

let lb=null,lbDrag=false;
function openLightbox(list,idx,ctx){if(!list.length)return;lb={list:[...list],idx,ctx};const el=$('#lightbox');el.classList.add('open');el.setAttribute('aria-hidden','false');document.documentElement.classList.add('locked');drawLB('in')}
function closeLB(){const el=$('#lightbox');el.classList.remove('open');el.setAttribute('aria-hidden','true');$$('video',el).forEach(v=>v.pause());lb=null;if(!sheets.length)document.documentElement.classList.remove('locked');setTimeout(()=>{if(!lb)el.innerHTML=''},350)}
function lbGo(d){if(!lb||lb.list.length<2)return;$$('#lightbox video').forEach(v=>v.pause());lb.idx=(lb.idx+d+lb.list.length)%lb.list.length;haptic(5);drawLB(d>0?'inU':'inD')}
function drawLB(anim){
  const el=$('#lightbox'),id=lb.list[lb.idx],m=mediaMeta(id);if(!m){closeLB();return}
  const u=urls[id]||{},own=ownerOf(id),inField=lb.ctx&&lb.ctx!=='library';

  <div class="lb-stage"><div class="lb-track ${anim||''}">${!u.full?`<div class="tile-ph">${icon('image')}Datei nicht verfügbar</div>`:m.type==='video'?`<div class="lb-vid"><video src="${u.full}" playsinline webkit-playsinline autoplay loop ${u.thumb?`poster="${u.thumb}"`:''}></video><div class="lb-play">${icon('play')}</div><div class="lb-prog"><i></i></div></div>`:`<img src="${u.full}" alt="${esc(m.name)}" draggable="false">`}</div></div>
  <button class="lb-nav prev" data-lb="prev" aria-label="Zurück">${icon('chevL')}</button><button class="lb-nav next" data-lb="next" aria-label="Weiter">${icon('chevR')}</button>
  <div class="lb-bottom"><div class="lb-info"><b>${esc(m.name)}</b><span>${fmtSize(m.size)}${m.w?` · ${m.w}×${m.h}`:''}${m.duration?` · ${fmtDur(m.duration)}`:''} · ${new Date(m.created).toLocaleDateString('de-DE',{day:'numeric',month:'short'})}</span></div>
  <div class="lb-actions">${inField?'<span style="flex:1"></span>':`<select class="inp" data-lb-link aria-label="Verknüpfen"><option value="">Nicht verknüpft</option>${opt('post',state.posts,'Videos','title')}${opt('idea',state.ideas,'Ideen','title')}</select>`}
  <button class="lb-btn danger" data-lb="delete" aria-label="Löschen">${icon('trash')}</button></div></div>`;
  setupLBVideo(el);
}
let lbMuted=false;
function setupLBVideo(el){const v=$('.lb-track video',el);if(!v)return;v.muted=lbMuted;
  const pr=v.play();if(pr)pr.catch(()=>{v.muted=true;lbMuted=true;const b=$('[data-lb=mute]',el);if(b)b.innerHTML=icon('mute');v.play().catch(()=>{})});
  const bar=$('.lb-prog i',el);v.addEventListener('timeupdate',()=>{if(bar&&v.duration)bar.style.width=(v.currentTime/v.duration*100)+'%'})}
function lbTogglePlay(){const el=$('#lightbox'),v=$('.lb-track video',el),pl=$('.lb-play',el);if(!v)return;
  if(v.paused)v.play().catch(()=>{});else v.pause();pl.innerHTML=icon(v.paused?'play':'pause');pl.classList.add('show');haptic(6);
  clearTimeout(pl._t);if(!v.paused)pl._t=setTimeout(()=>pl.classList.remove('show'),500)}
(function bindLB(){
  const el=$('#lightbox');let s=null;
  el.addEventListener('click',async e=>{const b=e.target.closest('[data-lb]');if(!b)return;const a=b.dataset.lb;

    if(a==='download'){const id=lb.list[lb.idx],m=mediaMeta(id);try{const rec=await MediaDB.get(id);if(rec?.blob)await saveFile(m?.name||'datei',rec.blob)}catch(e){toast('Download fehlgeschlagen','x')}}

      else{const ok=await confirmDlg('Datei endgültig aus Inspo löschen?');if(!ok||!lb)return;await deleteMedia(id);lb.list.splice(lb.idx,1);toast('Gelöscht','trash')}
      if(!lb.list.length)closeLB();else{lb.idx=Math.min(lb.idx,lb.list.length-1);drawLB('in')}}});
  el.addEventListener('change',e=>{if(!e.target.matches('[data-lb-link]'))return;const id=lb.list[lb.idx];

  el.addEventListener('pointerdown',e=>{if(!e.target.closest('.lb-stage'))return;const tr=$('.lb-track',el);if(!tr)return;tr.style.transition='none';s={x:e.clientX,y:e.clientY,dx:0,dy:0,axis:null,tr,onVid:!!e.target.closest('.lb-vid')};lbDrag=true});
  el.addEventListener('pointermove',e=>{if(!s)return;s.dx=e.clientX-s.x;s.dy=e.clientY-s.y;if(!s.axis&&Math.hypot(s.dx,s.dy)>8)s.axis=Math.abs(s.dx)>Math.abs(s.dy)?'x':'y';
    if(s.axis==='y'){const multi=lb.list.length>1;s.tr.style.transform=`translateY(${multi?s.dy:Math.max(0,s.dy)}px)`;if(!multi||s.dy>0&&lb.idx===0)el.style.background=`rgba(0,0,0,${Math.max(.3,.96-Math.abs(s.dy)/500)})`}

  el.addEventListener('pointerup',end);el.addEventListener('pointercancel',end);

async function deleteMedia(id){
  for(const k of ['posts','ideas','products'])state[k].forEach(x=>{x.media=(x.media||[]).filter(m=>m!==id)});
  state.media=state.media.filter(m=>m.id!==id);save();

  const u=urls[id];if(u){u.full&&URL.revokeObjectURL(u.full);u.thumb&&URL.revokeObjectURL(u.thumb);delete urls[id]}
  renderView(false);renderNav();
}

      <button class="frow" data-s="export"><span class="ficon">${icon('download')}</span><div class="t"><b>Backup exportieren</b><span>Alle Daten als JSON (ohne Mediendateien)</span></div>${icon('chevR','chev')}</button>
      <button class="frow" data-s="import"><span class="ficon">${icon('upload')}</span><div class="t"><b>Backup importieren</b><span>JSON-Datei wiederherstellen</span></div>${icon('chevR','chev')}</button>
      <button class="frow" data-act="manage-styles"><span class="ficon">${icon('sparkles')}</span><div class="t"><b>Video-Stile</b><span>${state.styles.length?state.styles.length+' eigene Stile':'Eigene Stile anlegen'}</span></div>${icon('chevR','chev')}</button>
      <button class="frow" data-s="brief"><span class="ficon">${icon('sun')}</span><div class="t"><b>Morgen-Briefing anzeigen</b><span>Erscheint automatisch beim ersten Öffnen am Tag</span></div>${icon('chevR','chev')}</button>
    </div>
    <div class="list-h">Speicher</div><div class="list"><div class="frow" style="cursor:default"><span class="ficon dark">${icon('image')}</span><div class="t"><b>${state.media.length} Medien · ${fmtSize(state.media.reduce((s,m)=>s+(m.size||0),0))}</b><span>${MediaDB.db?'Offline im Browser gespeichert':'Nur temporär (privater Modus?)'}${est?' · '+est:''}</span></div></div></div>
    <div class="list-h">Zurücksetzen</div><div class="list">
      <button class="frow" data-s="demo"><span class="ficon">${icon('refresh')}</span><div class="t"><b>Demo-Daten laden</b><span>Ersetzt Accounts, Videos, Produkte & Notizen</span></div></button>
      <button class="frow" data-s="reset"><span class="ficon" style="color:var(--red)">${icon('trash')}</span><div class="t"><b style="color:var(--red)">Alles löschen</b><span>Inklusive aller Medien & Profilbilder</span></div></button>
    </div>
    <p class="foot-note" style="margin-top:24px">Fleet Command Center · lokal & offline</p>`,
  onMount(s){s.el.addEventListener('click',async e=>{const b=e.target.closest('[data-s]');if(!b)return;const k=b.dataset.s;
    if(k==='exportfull'){toast('Backup wird erstellt …','download');const recs=await MediaDB.all();const mediaFiles={};for(const r of recs){mediaFiles[r.id]={blob:r.blob?await blob2du(r.blob):null,thumb:r.thumb?await blob2du(r.thumb):null,kind:r.kind||null}}
      const data=JSON.stringify({...state,exported:new Date().toISOString(),format:'fleet-full-1',mediaFiles});saveFile(`fleet-komplett-${dkey()}.json`,new Blob([data],{type:'application/json'}))}
    if(k==='export'){const data=JSON.stringify({...state,exported:new Date().toISOString()},null,2);saveFile(`fleet-backup-${dkey()}.json`,new Blob([data],{type:'application/json'}))}
    if(k==='import'){const inp=$('#jsonpick');inp.value='';inp.onchange=async()=>{try{const d=JSON.parse(await inp.files[0].text());if(!Array.isArray(d.accounts))throw new Error('format');
      if(!await confirmDlg('Aktuelle Daten durch das Backup ersetzen?','Importieren',false))return;if(d.mediaFiles){toast('Medien werden wiederhergestellt …','upload');for(const [id,mf] of Object.entries(d.mediaFiles)){const blob=mf.blob?du2blob(mf.blob):null,thumb=mf.thumb?du2blob(mf.thumb):null;await MediaDB.put({id,blob,thumb,...(mf.kind?{kind:mf.kind}:{})});const o=urls[id];if(o){o.full&&URL.revokeObjectURL(o.full);o.thumb&&URL.revokeObjectURL(o.thumb)}urls[id]={full:blob?URL.createObjectURL(blob):null,thumb:thumb?URL.createObjectURL(thumb):null}}delete d.mediaFiles;delete d.format}const keepMedia=state.media;state={...d};state.media=(d.media||[]).filter(m=>urls[m.id]).concat(keepMedia.filter(m=>!(d.media||[]).some(x=>x.id===m.id)));delete state.exported;normalize();save();s.close();render(true);toast('Backup importiert')}catch(err){toast('Ungültige Backup-Datei','x')}};inp.click()}
    if(k==='brief'){s.close();setTimeout(openBriefing,250)}
    if(k==='demo'){if(await confirmDlg('Demo-Daten laden? Deine Accounts, Videos, Produkte und Notizen werden ersetzt.','Laden',false)){const media=state.media;state=seed();state.media=media;normalize();save();s.close();render(true);toast('Demo geladen')}}
    if(k==='reset'){if(await confirmDlg('Wirklich alles löschen? Das kann nicht rückgängig gemacht werden.','Alles löschen')){try{await MediaDB.clear()}catch(e){}localStorage.removeItem(KEY);location.reload()}}
  })}});
}

/* ---------------- Init ---------------- */
async function init(){applyThemeMeta();
  try{await MediaDB.open();const recs=await MediaDB.all();recs.forEach(r=>{urls[r.id]={full:r.blob?URL.createObjectURL(r.blob):null,thumb:r.thumb?URL.createObjectURL(r.thumb):null}})}
  catch(e){console.warn('IndexedDB nicht verfügbar – Medien nur temporär',e)}
  render(true);
  const t=dkey();
  if(state.lastOpen&&state.lastOpen!==t){state.lastOpen=t;save();setTimeout(openBriefing,650)}else{state.lastOpen=t;save()}
}
init();
/* Service Worker (Offline / Home-Bildschirm) */
if('serviceWorker' in navigator&&/^https?:$/.test(location.protocol))addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
</script>
</body>
</html>
